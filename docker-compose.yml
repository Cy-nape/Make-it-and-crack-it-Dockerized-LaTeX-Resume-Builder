services:
  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      PORT: 3001
    expose:
      - "3001"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
        VITE_GEMINI_API_KEY: "${VITE_GEMINI_API_KEY:-AQ.Ab8RN6KhsRygy4Kvy7fcALktfomET2FXVirBikfmwVmf_EPj7Q}"
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
