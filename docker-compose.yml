services:
  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      PORT: 3001
    expose:
      - "3001"
    healthcheck:
      # curl se health check karo - ye Python image mein available hai (Dockerfile mein install kiya tha)
      # Node.js is Python image mein nahi hota isliye pehle wala fail ho raha tha
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
