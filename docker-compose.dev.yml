services:
  backend:
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development

  frontend:
    build:
      context: ./frontend
      target: build
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - VITE_API_URL=http://127.0.0.1:3001
      - VITE_GEMINI_API_KEY=${VITE_GEMINI_API_KEY:-AQ.Ab8RN6KhsRygy4Kvy7fcALktfomET2FXVirBikfmwVmf_EPj7Q}
